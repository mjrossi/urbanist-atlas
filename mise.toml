# Pin the language runtimes and tooling for both halves of the monorepo.
# Contributors install mise (https://mise.jdx.dev), then `mise install`
# at the repo root provisions everything below.
#
# Per-environment overlays:
#   - mise.development.toml  → MISE_ENV=development (local dev)
#   - mise.ci.toml           → MISE_ENV=ci (GitHub Actions)
#   - mise.local.toml        → uncommitted, machine-specific overrides
#                              (see mise.local.toml.example)

[tools]
# Language runtimes — patch-pinned so reproducibility > convenience.
go = "1.26.3"
node = "22.22.3"
# Python is used by the etl pipeline (slice #7.5.3+) to convert the
# Census CBSA delineation xlsx into CSV before the Go regenerate step
# parses it. See etl/scripts/xlsx_to_csv.py and etl/SOURCES.md. Not
# needed at runtime — only by contributors who run `urbanist etl
# download` or refresh upstream vintages.
python = "3.14"

# Project tooling. Pinned versions because reproducibility > convenience.
# These get added/bumped as they're introduced into the codebase.
"aqua:sqlc-dev/sqlc" = "1.28.0"
"aqua:pressly/goose" = "3.24.0"
"aqua:casey/just" = "1.51.0"
"go:honnef.co/go/tools/cmd/staticcheck" = "2025.1.1"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.7.0"
# Python `openpyxl` is a library (no CLI entry point) so it can't be
# managed via mise's pipx backend — contributors install it on demand
# via `pip install -r etl/scripts/requirements.txt` when refreshing
# the Census xlsx source. Pinned in that requirements file.

[env]
# Defaults that apply everywhere. Per-env files override these.
URBANIST_PORT = "8080"
URBANIST_LOG_FORMAT = "json"
