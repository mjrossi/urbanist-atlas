<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf6ec" />

    <title>Urbanist Atlas — Transit and safe-streets advocacy near you</title>
    <meta
      name="description"
      content="A directory of transit and safe-streets advocacy organizations across the US and Canada. Find the people fighting for better streets where you live."
    />
    <link rel="canonical" href="https://urbanistatlas.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Urbanist Atlas" />
    <meta property="og:title" content="Urbanist Atlas — Transit and safe-streets advocacy near you" />
    <meta
      property="og:description"
      content="A directory of transit and safe-streets advocacy organizations across the US and Canada. Find the people fighting for better streets where you live."
    />
    <meta property="og:url" content="https://urbanistatlas.com/" />
    <meta property="og:image" content="https://urbanistatlas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />

    <!--
      An <link rel="alternate"> pointing at the OpenAPI spec belongs
      here, but the URL has to be env-aware (Phase 1 only runs
      qa-api.urbanistatlas.com; api.urbanistatlas.com is unreachable
      until Phase 2 cutover). Vite doesn't substitute import.meta.env
      into index.html without a custom transformIndexHtml hook, so the
      link is exposed instead via the env-aware About + Colophon
      "OpenAPI spec" links. Restore here once the API host name
      stabilizes.
    -->

    <script type="module" src="/src/main.tsx"></script>

    <!--
      Cloudflare Web Analytics (privacy-first, cookieless) is NOT shipped
      here. It is injected at the edge by Cloudflare (Web Analytics →
      automatic injection, enabled in the dashboard), so no beacon tag and
      no token live in this repo. The browser still enforces CSP against
      the injected tag, so its origins (static.cloudflareinsights.com /
      cloudflareinsights.com) are allow-listed in web/public/_headers.
    -->
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
