<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf6ec" />

    <title>Urbanist Atlas — Transit and safe-streets advocacy near you</title>
    <meta
      name="description"
      content="A directory of transit and safe-streets advocacy organizations across the US and Canada. Find the people fighting for better streets where you live."
    />
    <link rel="canonical" href="https://urbanistatlas.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Urbanist Atlas" />
    <meta property="og:title" content="Urbanist Atlas — Transit and safe-streets advocacy near you" />
    <meta
      property="og:description"
      content="A directory of transit and safe-streets advocacy organizations across the US and Canada. Find the people fighting for better streets where you live."
    />
    <meta property="og:url" content="https://urbanistatlas.com/" />
    <meta property="og:image" content="https://urbanistatlas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />

    <!--
      An <link rel="alternate"> pointing at the OpenAPI spec belongs
      here, but the URL has to be env-aware (Phase 1 only runs
      qa-api.urbanistatlas.com; api.urbanistatlas.com is unreachable
      until Phase 2 cutover). Vite doesn't substitute import.meta.env
      into index.html without a custom transformIndexHtml hook, so the
      link is exposed instead via the env-aware About + Colophon
      "OpenAPI spec" links. Restore here once the API host name
      stabilizes.
    -->

    <script type="module" src="/src/main.tsx"></script>

    <!--
      Cloudflare Web Analytics — privacy-first, cookieless, no consent
      banner. The beacon's SPA mode auto-tracks React Router navigations
      via the History API, so client-side route changes are recorded
      without per-route code. The token is public (it only identifies
      the site in the CF dashboard), so hardcoding it here is fine —
      and Vite doesn't substitute import.meta.env into index.html
      anyway. The beacon loads from static.cloudflareinsights.com and
      POSTs RUM data to cloudflareinsights.com; both are allow-listed in
      web/public/_headers (script-src / connect-src).

      TODO: replace <BEACON_TOKEN> with the token from the Cloudflare
      dashboard (Web Analytics → urbanistatlas.com) before deploying.
    -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token":"<BEACON_TOKEN>"}'
    ></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
