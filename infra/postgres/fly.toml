# fly.toml app configuration file generated for urbanist-atlas-db on 2026-05-21T16:26:14-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'urbanist-atlas-db'
primary_region = 'iad'

[build]
  image = 'postgres:17-alpine'

[env]
  POSTGRES_DB = 'urbanist_atlas'
  POSTGRES_USER = 'urbanist'
  # Fly's ext4 volumes auto-include a `lost+found` directory at the
  # mount root, which trips initdb's "directory exists but is not
  # empty" guard. Point PGDATA at a subdirectory of the mount so
  # initdb has a clean target — the upstream postgres image honors
  # PGDATA over its built-in default of /var/lib/postgresql/data.
  PGDATA = '/var/lib/postgresql/data/pgdata'

[[mounts]]
  source = 'pgdata'
  destination = '/var/lib/postgresql/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
