# fly.toml app configuration file generated for urbanist-atlas on 2026-05-21T16:30:06-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'urbanist-atlas'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  # CORS allowlist for Phase 1.
  # - https://qa.urbanistatlas.com — the QA SPA hostname (custom domain on the Workers project)
  # - *.link00seven.workers.dev — Cloudflare Workers preview versions (account-scoped subdomain;
  #   the Workers Static Assets analog of the old Pages `*.pages.dev` previews; Cloudflare's
  #   Pages-into-Workers consolidation means previews now live under `<account>.workers.dev`)
  # At prod launch, append https://urbanistatlas.com; once QA retires, drop the qa.* entry.
  URBANIST_CORS_ORIGINS = 'https://qa.urbanistatlas.com,*.link00seven.workers.dev'
  URBANIST_LOG_FORMAT = 'json'
  URBANIST_PORT = '8080'
  URBANIST_SEED_DIR = '/app/seed'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Liveness: process-level. Doesn't touch the DB so a transient
  # downstream blip doesn't trigger a machine recycle.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

  # Readiness: traffic-gating. The file-backed store has no external
  # dependency, so /readyz collapses to a process-up check. Kept
  # separate from /healthz so it stays a meaningful traffic gate if
  # a write surface (SQLite) is added later.
  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
