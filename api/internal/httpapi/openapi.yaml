openapi: 3.0.3

info:
  title: Urbanist Atlas API
  version: 1.0.0
  description: |
    Urbanist Atlas is a US + Canada directory of transit and
    safe-streets advocacy organizations. Enter a ZIP or Canadian
    postal code and get back the local and regional organizations
    working in your area.

    This document is the wire contract for the public v1 API. The
    canonical copy is checked in at `api/openapi.yaml` and served by
    the API itself at `GET /api/v1/openapi.yaml` so external consumers
    can discover it.

    ## Conventions

    - All request and response bodies are JSON (`application/json`),
      except `/healthz` (plain text) and `/api/v1/openapi.yaml` (YAML).
    - All error responses use [RFC 9457 Problem Details](https://www.rfc-editor.org/rfc/rfc9457.html)
      with content-type `application/problem+json`. See the
      `ProblemDetails` schema for the field list and the catalog of
      stable `type` URIs.
    - Every response includes an `X-Request-ID` header; error response
      bodies also echo it as the `request_id` extension field so
      clients can quote it when reporting bugs.
    - Every `/api/v1/**` response carries `X-Data-License: ODbL-1.0`
      and `X-Data-Attribution: https://urbanistatlas.com` headers
      announcing the dataset license (ODbL 1.0; see `LICENSE-DATA`
      in the repo). Collection responses additionally carry a `meta`
      envelope with `license`, `attribution_url`, and `generated_at`
      (RFC3339 UTC) — the array lives at `data`. The envelope keeps
      the license obligation in-band when transport headers are
      stripped.
    - Admin endpoints require an `Authorization: Bearer <token>`
      header; the token is configured via the `URBANIST_ADMIN_TOKEN`
      environment variable on the server.
    - Every public `GET` endpoint (everything listed below except the
      admin-only routes) also accepts `HEAD` — same status, same
      headers, empty body per RFC 9110 §9.3.2. This is for
      link-preview tools (Slack, Discord) and uptime probes that
      `HEAD` a URL before unfurling or alerting. The OpenAPI
      specification does not enumerate `head:` operations
      separately; consumers can rely on the GET-equivalent
      contract.

    Companion to the maintainer's publication, *Urbanist Lexicon*
    (https://mjrossi.com).
  contact:
    name: Urbanist Atlas
    url: https://urbanistatlas.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.urbanistatlas.com
    description: Production

# Default security on every operation is "none" (public endpoints).
# Admin endpoints individually declare `security: [{BearerAuth: []}]`
# to require the moderator bearer token.
security: []

tags:
  - name: meta
    description: Service-level endpoints (health, contract discovery).
  - name: lookup
    description: Postal-code → organizations search.
  - name: browse
    description: Browseable regions (metros, cities, and any other graph node) and recently-added organizations.
  - name: submissions
    description: Public submissions of new organizations.
  - name: admin
    description: Moderator-only endpoints. Require a bearer token.

paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe.
      description: |
        Used by Fly as a liveness check. Deliberately does NOT touch
        any downstream dependency (database, etc.) so a DB outage
        doesn't cause Fly to recycle the machine and lose the recovery
        window. Pair with `/readyz` for the downstream-aware probe.
      operationId: getHealth
      responses:
        '200':
          description: Service is running.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /readyz:
    get:
      tags: [meta]
      summary: Readiness probe.
      description: |
        Returns 200 only when the data store is reachable (a 1-second
        store ping has succeeded). Returns 503 with an
        `application/problem+json` body (`type=https://urbanistatlas.com/problems/not-ready`)
        when the store is unavailable. Use this as the Fly readiness
        check so traffic stops routing to a machine that can't serve
        queries; keep `/healthz` as the liveness check so a transient
        downstream blip doesn't trigger a machine recycle.

        The bundled in-memory FileStore currently has no out-of-process
        dependency to ping, so `/readyz` resolves to 200 as soon as the
        process is up. The probe stays in place so a future
        network-bound store implementation can opt in to the
        readiness gate without an API change.
      operationId: getReady
      responses:
        '200':
          description: Service can serve queries (store is reachable).
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
        '503':
          description: Service is up but the data store is unreachable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      summary: Returns this OpenAPI specification.
      description: |
        Lets external consumers discover the wire contract at runtime.
        The body is identical to the `api/openapi.yaml` file checked
        into the repo at the running binary's release.
      operationId: getOpenAPISpec
      responses:
        '200':
          description: The OpenAPI 3 specification, in YAML.
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/lookup:
    get:
      tags: [lookup]
      summary: Look up advocacy organizations for a postal code.
      description: |
        Resolves the postal code to a set of geographic regions, then
        returns all approved organizations that serve any of those
        regions. Results are bucketed into `local` (city/county-level)
        and `regional` (metro/state/province/multi-state) groups, in
        that order of geographic specificity within each bucket.

        Canadian postal codes are normalized to the 3-character FSA
        (e.g. `M5V 3A8` → `M5V`) server-side; clients may pass either
        form.

        A code with no mapped region returns 404. US military (APO/FPO)
        and diplomatic (DPO) ZIPs are a special case of that 404, carrying
        `type` `https://urbanistatlas.com/problems/military-postal-code`
        so clients can prompt for a residential ZIP instead.

        This is a single-object response — the body is a bare
        `LookupResult` with no `{meta, data}` envelope. ODbL
        attribution travels via the `X-Data-License` and
        `X-Data-Attribution` response headers (set on every
        `/api/v1/**` response), not an in-band `meta.license` field;
        the `meta` envelope is reserved for collection responses.
      operationId: lookup
      parameters:
        - $ref: '#/components/parameters/PostalCodeQuery'
        - $ref: '#/components/parameters/CountryQuery'
      responses:
        '200':
          description: Lookup succeeded.
          headers:
            X-Data-License:
              $ref: '#/components/headers/XDataLicense'
            X-Data-Attribution:
              $ref: '#/components/headers/XDataAttribution'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions:
    get:
      tags: [browse]
      summary: List regions with approved organization counts.
      description: |
        Feeds the "Browse" panel on the home page. Returns the
        editorial default browse set — metros and cities — with at
        least one approved organization tagged to them directly or
        via the region DAG, plus an org count for each.

        The region graph models global civic geography as a DAG —
        cities under metros, metros under multi-state regions, all
        of them with state/province edges where they apply. A
        ZIP-level lookup walks the graph **upward** (and partitions
        by scope_tier); this endpoint walks **downward** from each
        included region, so a metro's count includes orgs tagged to
        its constituent cities and boroughs. "Chicago Metro" and
        "Chicago" both appear, with the metro count strictly ≥ the
        city count.

        `scope_tier='national'` regions are always excluded (the v1
        editorial decision; revisit when a national browse experience
        ships). The list endpoint deliberately ships without filter
        parameters; the right filter axis (taxonomy via `kind`, DAG
        via `ancestor`, etc.) will be designed when a concrete browse
        UI use case appears.

        Pagination: v1 returns the whole list in a single response and
        will never default-truncate a today-complete result — a
        response without a cursor means you have every row. When
        pagination is introduced it will be additive and follow the
        same opaque-cursor convention as the admin `listSubmissions`
        endpoint: the response carries an `X-Next-Cursor` header (and
        an optional `meta.next_cursor`) when more rows exist beyond the
        current page; pass that value back as `?cursor=` to fetch the
        next page. The cursor format is undocumented and may change
        without notice — treat it as opaque. No `cursor` parameter is
        accepted yet.
      operationId: listRegions
      responses:
        '200':
          description: |
            Regions with counts, ordered by org count descending then
            name ascending. Wrapped in a `{ meta, data }` envelope;
            the `RegionSummary[]` lives at `data`.
          headers:
            X-Data-License:
              $ref: '#/components/headers/XDataLicense'
            X-Data-Attribution:
              $ref: '#/components/headers/XDataAttribution'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionSummariesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions/{slug}:
    get:
      tags: [browse]
      summary: Get a single region and the organizations that serve it.
      description: |
        Resolves any non-national region in the graph by slug — metros,
        cities, counties, boroughs, states/provinces, multi-state
        coalitions. Returns a `RegionDetail` with the focus region plus
        the orgs attached to it OR any DAG descendant, bucketed into
        `local` and `regional` by the `scope_tier` of each org's
        matched attachment region. Ancestor orgs are NOT pulled in —
        the city detail page is "what does Brooklyn contain?", not
        "what works at a Brooklyn address?" (the latter is `/lookup`'s
        job, with its upward walk). Keeping the in-scope set
        symmetric with `/api/v1/regions`'s descendant-walk `org_count`
        means the card's promised count matches this page's
        delivered count. `scope_tier='national'` slugs return 404
        (same v1 editorial gate as `/lookup` and the list endpoint).

        `ancestry` carries the upward walk for breadcrumbs only — it
        does not affect org scope. `descendant_region_names` is a
        slug → display-name map covering every descendant region
        referenced by an org's `matched_region_slugs`, so clients can
        render "Matched via Brooklyn" instead of "matched via
        brooklyn-ny" without a second request.

        This is a single-object response — the body is a bare
        `RegionDetail` with no `{meta, data}` envelope. ODbL
        attribution travels via the `X-Data-License` and
        `X-Data-Attribution` response headers (set on every
        `/api/v1/**` response), not an in-band `meta.license` field;
        the `meta` envelope is reserved for collection responses.

        The `slug` you address here is a stable public identifier —
        once published it is appended-to, never renamed (see the
        `RegionSlug` parameter and `docs/region-graph.md`).
      operationId: getRegion
      parameters:
        - $ref: '#/components/parameters/RegionSlug'
      responses:
        '200':
          description: The region and its descendant organizations.
          headers:
            X-Data-License:
              $ref: '#/components/headers/XDataLicense'
            X-Data-Attribution:
              $ref: '#/components/headers/XDataAttribution'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions/search:
    get:
      tags: [browse]
      summary: Search regions by name or slug for type-ahead.
      description: |
        Case-insensitive search over the FULL region graph — every kind
        (boroughs, counties, cities, metros/CMAs, states/provinces,
        multi-state coalitions), not just the curated browse set that
        `GET /api/v1/regions` returns. Powers the region type-ahead on
        the public submission form so a submitter can attach an org to a
        canonical slug instead of free text.

        Results are ranked for relevance — exact slug, then exact name,
        then name prefix, then slug prefix, then substring — with name
        ascending (then slug ascending) as the stable tiebreak. Each
        result carries a `context_label`: the nearest state/province
        ancestor's name (e.g. "New York" for `queens`), so the client
        can tell same-named leaves apart ("Springfield" in IL vs MA).
        The label is an empty string when no state ancestor resolves.

        `scope_tier='national'` regions are always excluded (the same v1
        editorial gate as `/lookup` and the other browse endpoints). A
        blank or omitted `q` returns an empty `data` array rather than
        an error, so the client's empty-input state needs no special
        handling.

        Wrapped in the standard `{ meta, data }` collection envelope.
      operationId: searchRegions
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: |
            The search term. Matched case-insensitively against region
            name and slug. Blank, whitespace-only, or omitted returns an
            empty result set.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
          description: Maximum number of results to return. Capped at 20.
      responses:
        '200':
          description: |
            Matching regions, ranked by relevance. Wrapped in a
            `{ meta, data }` envelope; the `RegionSearchResult[]` lives
            at `data`.
          headers:
            X-Data-License:
              $ref: '#/components/headers/XDataLicense'
            X-Data-Attribution:
              $ref: '#/components/headers/XDataAttribution'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionSearchResultsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orgs/{slug}:
    get:
      tags: [browse]
      summary: Get a single organization by slug.
      description: |
        Returns the addressable detail view for one approved organization.
        The body is a bare `Org` — no `{meta, data}` envelope, since
        this is a single-object response; ODbL attribution travels via
        the `X-Data-License` and `X-Data-Attribution` response headers.
      operationId: getOrg
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: transportation-alternatives
      responses:
        '200':
          description: The organization, with every region it serves denormalized at `regions`.
          headers:
            X-Data-License:
              $ref: '#/components/headers/XDataLicense'
            X-Data-Attribution:
              $ref: '#/components/headers/XDataAttribution'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/recent:
    get:
      tags: [browse]
      summary: Recently approved organizations.
      description: |
        Feeds the "Recently added" strip on the home page. Returns the
        most-recently-approved organizations across the whole atlas,
        newest first.

        Pagination: v1 returns the whole list in a single response and
        will never default-truncate a today-complete result — a
        response without a cursor means you have every row. When
        pagination is introduced it will be additive and follow the
        same opaque-cursor convention as the admin `listSubmissions`
        endpoint: the response carries an `X-Next-Cursor` header (and
        an optional `meta.next_cursor`) when more rows exist beyond the
        current page; pass that value back as `?cursor=` to fetch the
        next page. The cursor format is undocumented and may change
        without notice — treat it as opaque. No `cursor` parameter is
        accepted yet.
      operationId: listRecent
      responses:
        '200':
          description: |
            Recently approved organizations. Wrapped in a
            `{ meta, data }` envelope; the `Org[]` lives at `data`.
          headers:
            X-Data-License:
              $ref: '#/components/headers/XDataLicense'
            X-Data-Attribution:
              $ref: '#/components/headers/XDataAttribution'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/stats:
    get:
      tags: [meta]
      summary: Atlas-wide size summary.
      description: |
        Dataset-level counts: how many organizations the atlas holds,
        how many regions, and the same split per country.

        Use this for any "how big is the atlas" number. In particular,
        do NOT compute a total organization count by summing
        `direct_org_count` over `GET /api/v1/regions` — that endpoint
        returns only the browseable subset (metros and cities), so the
        sum silently omits every organization attached solely to a
        state, province, borough, or multi-state region. `Stats`
        counts distinct organizations at the source and is not subject
        to that omission.

        Single-resource response: no `{ meta, data }` envelope. The
        ODbL attribution travels in the `X-Data-License` and
        `X-Data-Attribution` headers, as on every `/api/v1` response.
      operationId: getStats
      responses:
        '200':
          description: The atlas-wide counts.
          headers:
            X-Data-License:
              $ref: '#/components/headers/XDataLicense'
            X-Data-Attribution:
              $ref: '#/components/headers/XDataAttribution'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/submissions:
    post:
      tags: [submissions]
      summary: Submit a new organization for review.
      description: |
        Anyone can submit an organization. The submission lands in the
        moderation queue with `status: pending` and is reviewed by a
        maintainer before becoming visible in lookups. Rate-limited
        per source IP.
      operationId: createSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSubmissionRequest'
      responses:
        '201':
          description: Submission accepted into the queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/submissions:
    get:
      tags: [admin]
      summary: List pending submissions.
      description: |
        Returns submissions in the moderation queue. By default returns
        only `pending` submissions; pass `status=approved` or
        `status=rejected` to view history. Results are newest-first
        with stable keyset pagination on `(created_at, id)`.

        Pagination uses an opaque cursor. When more rows exist beyond
        the current page, the response carries an `X-Next-Cursor`
        header; pass that value back as `?cursor=` to fetch the next
        page. The cursor format is undocumented and may change without
        notice — treat it as opaque.
      operationId: listSubmissions
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/SubmissionStatus'
          description: Filter by submission status. Defaults to `pending`.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of submissions to return. Capped at 200.
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: |
            Opaque pagination token. Pass the value of the previous
            response's `X-Next-Cursor` header to fetch the next page.
            Omit to start at the newest submission.
      responses:
        '200':
          description: Submissions matching the filter, newest first.
          headers:
            X-Next-Cursor:
              description: |
                Opaque cursor for the next page. Present only when more
                rows exist beyond the current page.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/submissions/{id}/approve:
    post:
      tags: [admin]
      summary: Approve a submission and queue a promotion PR.
      description: |
        Marks the submission `approved` and enqueues an async GitHub PR
        that appends the new organization to `api/seed/orgs.toml`. The
        approval call returns as soon as the row is updated; the PR URL
        (or a `promotion_error`) is attached to the row when the worker
        finishes. If the worker failed, `urbanist-atlas-server
        submissions retry-pr --id=<uuid>` re-queues the job.
      operationId: approveSubmission
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionID'
      responses:
        '200':
          description: |
            Submission approved. The returned record may already include
            `promotion_pr_url` or `promotion_error` if the worker
            finished synchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Submission is not in `pending` state.
            Response body is an RFC 9457 problem document with
            `type` `https://urbanistatlas.com/problems/conflict`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/submissions/{id}/reject:
    post:
      tags: [admin]
      summary: Reject a submission with a reason.
      operationId: rejectSubmission
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubmissionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSubmissionRequest'
      responses:
        '200':
          description: Submission rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Submission is not in `pending` state.
            Response body is an RFC 9457 problem document with
            `type` `https://urbanistatlas.com/problems/conflict`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/coverage-gaps:
    get:
      tags: [admin]
      summary: List sampled empty-result lookups and searches.
      description: |
        Returns recent coverage gaps — sampled lookups and searches that
        resolved to no organizations. This is the editorial "which input
        returns nothing?" signal for deciding where to expand coverage.

        Capture is sampled and row-capped server-side
        (`URBANIST_COVERAGE_SAMPLE_RATE` / `URBANIST_COVERAGE_MAX_ROWS`),
        so this is a recent, partial sample — not an exhaustive log.
        Results are newest-first.
      operationId: listCoverageGaps
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of coverage gaps to return. Capped at 200.
      responses:
        '200':
          description: Recent coverage gaps, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoverageGap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/usage:
    get:
      tags: [admin]
      summary: List daily aggregate usage counts.
      description: |
        Returns accumulated daily usage buckets — content popularity
        (region and org views), the region a postal code resolved to,
        and lookup outcome/tier/country totals. This is the durable
        record behind the monthly usage digest, and it outlives the
        ~30-day Prometheus retention window.

        Buckets hold only public content identifiers (slugs) and bounded
        enum values; raw postal codes and search queries are never
        recorded here. Results are highest-count first.
      operationId: listUsage
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
          description: Inclusive start day (YYYY-MM-DD, UTC).
          example: '2026-08-01'
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
          description: Inclusive end day (YYYY-MM-DD, UTC).
          example: '2026-08-31'
        - in: query
          name: kind
          required: false
          schema:
            type: string
            enum: [region_view, org_view, lookup, lookup_tier, lookup_result, lookup_country]
          description: Restrict to one bucket kind. Omit for all kinds.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum number of buckets to return. Capped at 1000.
      responses:
        '200':
          description: Usage buckets, highest count first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageCount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        A single shared moderator token, configured via the
        `URBANIST_ADMIN_TOKEN` environment variable on the server.
        Multi-moderator auth is deferred to a future version.

  parameters:
    PostalCodeQuery:
      in: query
      name: postal_code
      required: true
      schema:
        type: string
      description: |
        US ZIP code (e.g. `11217`) or Canadian postal code or FSA
        (e.g. `M5V` or `M5V 3A8`). Whitespace is trimmed; CA codes are
        truncated to their 3-character FSA server-side.
    CountryQuery:
      in: query
      name: country
      required: true
      schema:
        $ref: '#/components/schemas/Country'
      description: ISO-style country code. Case-insensitive.
    RegionSlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
      description: |
        Any non-national region's slug. Examples: `nyc-metro` (metro),
        `chicago` (city), `cook-county` (county), `chicagoland`
        (multi-state region), `ny` (state), `toronto-cma`
        (Canadian CMA), `metro-vancouver` (regional district).

        Slugs are stable public identifiers. Once a slug is published
        it is appended-to, never renamed — a published slug will not
        change out from under a bookmark or an external consumer.
        Curated and override-pinned slugs are fully stable;
        auto-generated MSA/CMA slugs can in principle shift on an
        upstream-vintage bump and are pinned via the override file when
        that matters. See `docs/region-graph.md` for the contributor
        append-not-rename rule and the stable-vs-volatile split.
    SubmissionID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: |
        The submission's public ID — a UUIDv7 string generated when the
        row was created. The numeric storage ID is never exposed.

  headers:
    XDataLicense:
      description: |
        SPDX identifier of the dataset license. Stable for the
        lifetime of v1.
      schema:
        type: string
        example: ODbL-1.0
    XDataAttribution:
      description: |
        URL downstream consumers should link to when crediting
        the source.
      schema:
        type: string
        format: uri
        example: https://urbanistatlas.com

  responses:
    BadRequest:
      description: |
        Request was malformed or missing required parameters.
        Response body is an RFC 9457 problem document with
        `type` typically `https://urbanistatlas.com/problems/validation`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: |
        Authentication failed. Either the request omitted required
        auth (missing `X-Atlas-Client` header during the Phase 1
        dogfooding lockdown, or missing `Authorization` bearer on an
        admin endpoint), or the presented value was invalid.
        Response body is an RFC 9457 problem document with
        `type` `https://urbanistatlas.com/problems/unauthorized`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: |
        The requested resource was not found.
        Response body is an RFC 9457 problem document with
        `type` `https://urbanistatlas.com/problems/not-found`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: |
        Rate limit exceeded. Includes a `Retry-After` header.
        Response body is an RFC 9457 problem document with
        `type` `https://urbanistatlas.com/problems/rate-limited`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds the client should wait before retrying.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: |
        An unexpected server error occurred. The `request_id`
        extension field (and the `X-Request-ID` response header)
        identify the request in server logs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:

    Country:
      type: string
      description: |
        ISO-style country code. v1 ships with `US` and `CA`; additional
        countries (`DE`, `FR`, `UK`, `AU`, …) are added without spec
        changes as data is loaded.
      example: US

    CoverageGap:
      type: object
      description: |
        One sampled empty-result lookup or search — an editorial signal
        of where the directory has no coverage yet. Admin-only; capture
        is sampled, so the set is a recent partial sample.
      required: [kind, input, created_at]
      properties:
        kind:
          type: string
          enum: [lookup, search]
          description: |
            `lookup` — a postal-code lookup that resolved a region but
            surfaced no organizations. `search` — a region type-ahead
            query that matched nothing.
        country:
          type: string
          description: |
            Lookup country (e.g. `US`, `CA`). Empty/omitted for `search`
            gaps, which have no country axis.
          example: US
        input:
          type: string
          description: |
            The normalized postal code (`lookup`) or the search query
            (`search`) that returned nothing.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the gap was recorded.

    UsageCount:
      type: object
      description: |
        One daily aggregate usage bucket. Admin-only. Holds public
        content identifiers and bounded enum values only — never raw
        user input.
      required: [day, kind, key, count]
      properties:
        day:
          type: string
          format: date
          description: UTC calendar day for this bucket.
          example: '2026-08-14'
        kind:
          type: string
          enum: [region_view, org_view, lookup, lookup_tier, lookup_result, lookup_country]
          description: |
            `region_view` / `org_view` — detail fetches, keyed by slug.
            `lookup` — the region a postal code resolved to, keyed by
            region slug. `lookup_tier` / `lookup_result` /
            `lookup_country` — lookup outcome totals, keyed by the
            corresponding enum value.
        key:
          type: string
          description: Region or org slug, or the enum value for outcome kinds.
          example: chicago-il
        count:
          type: integer
          description: Number of events in this bucket on this day.
          example: 42

    Meta:
      type: object
      description: |
        Attribution block included on every collection response.
        Carries the ODbL license obligation in-band so consumers
        that strip headers still see the share-alike requirement.
      required: [license, attribution_url, generated_at]
      properties:
        license:
          type: string
          example: ODbL-1.0
          description: |
            SPDX identifier of the data license. Stable for the
            lifetime of v1 (`ODbL-1.0`).
        attribution_url:
          type: string
          format: uri
          example: https://urbanistatlas.com
          description: |
            URL downstream consumers should link to when crediting
            the source.
        generated_at:
          type: string
          format: date-time
          example: "2026-05-18T12:34:56Z"
          description: |
            RFC 3339 timestamp recording when the response was
            produced server-side. Per-request — there is no caching
            layer in v1.
        next_cursor:
          type: string
          description: |
            Reserved for future pagination. Optional and absent in v1:
            collection endpoints return the whole list in a single
            response today. When present (a future additive change), it
            mirrors the `X-Next-Cursor` response header — an opaque
            token to pass back as `?cursor=` for the next page. Treat as
            opaque; the format may change without notice. Its absence
            always means there are no further rows.

    Stats:
      type: object
      description: |
        Atlas-wide size summary, returned by `GET /api/v1/stats`.

        Organizations whose ONLY region attachments are
        `scope_tier: national` are excluded from every count here,
        matching the default `/lookup`, `/recent`, and `/regions`
        filters.
      required: [total_org_count, total_region_count, browse_region_count, by_country]
      properties:
        total_org_count:
          type: integer
          format: int32
          description: |
            Distinct organizations in the atlas, counted once each no
            matter how many regions they attach to. This is the
            authoritative catalog size — it is NOT the sum of
            `direct_org_count` over `/api/v1/regions`, which omits
            orgs attached only to non-browseable regions.
          example: 236
        total_region_count:
          type: integer
          format: int32
          description: |
            Every non-national region in the graph — states, counties,
            metros, MSA portions, cities, boroughs. Much larger than
            `browse_region_count`.
          example: 628
        browse_region_count:
          type: integer
          format: int32
          description: |
            Regions returned by `GET /api/v1/regions`: browseable-kind
            regions carrying at least one organization in their
            subtree. Guaranteed equal to that endpoint's array length.
          example: 92
        by_country:
          type: array
          description: |
            Per-country breakdown, sorted by country code ascending.
          items:
            $ref: '#/components/schemas/CountryStats'

    CountryStats:
      type: object
      description: |
        One country's slice of `Stats`.

        An organization is credited to every country it has a
        non-national attachment in, so an org spanning the border
        appears in two rows and `org_count` can sum to more than
        `total_org_count`. No such organization exists in the v1
        dataset, but consumers must not treat this array as a
        partition of the total.
      required: [country, org_count, region_count]
      properties:
        country:
          $ref: '#/components/schemas/Country'
        org_count:
          type: integer
          format: int32
          description: Distinct organizations with at least one attachment in this country.
          example: 196
        region_count:
          type: integer
          format: int32
          description: This country's share of `browse_region_count`.
          example: 71

    ScopeTier:
      type: string
      enum: [local, regional, national]
      description: |
        Drives result grouping in `/lookup`. `local` for city/county
        regions; `regional` for metro/state/province/multi-state;
        `national` for country-wide umbrellas (federations, advocacy
        groups operating across an entire country).

        `national` regions are filtered from the default `/lookup`
        ancestor walk — they're present in the schema so that
        national-scope orgs (e.g. MUBi for Portugal, Living Streets
        for the UK) can be modeled without distorting local-first
        defaults. A future opt-in surface for national orgs is
        anticipated; until then, `national`-tier regions are hidden.

        See `docs/region-graph.md` for the per-country editorial
        policy on when to use `national` vs modeling state/regional
        chapters instead.

        Treat this as an open enum: although v1 ships exactly
        `local`, `regional`, and `national`, consumers should ignore
        unknown values rather than failing if a future tier is added
        (do not exhaustively switch and error on the default case).
        The enumerated set may grow without a breaking-change bump.

    RegionKind:
      type: string
      description: |
        Free-form taxonomy for region granularity. The recommended
        vocabulary uses country-prefixed values: `us:city`, `us:borough`,
        `us:county`, `us:metro`, `us:state`, `us:multi-state`,
        `us:transit-federation`, `ca:province`, `ca:regional-district`,
        `ca:city`, `ca:cma`, `pt:freguesia`, `pt:municipio`,
        `pt:cim`, `pt:area-metropolitana`, `pt:distrito`,
        `pt:nuts-ii`, `pt:regiao-autonoma`, `pt:nacional`,
        `de:land`, `de:bezirk`, `de:kreisfreie-stadt`,
        `de:transit-federation`, `fr:commune`, `fr:departement`,
        `fr:region`, `fr:metropole`. Clients should treat unknown kinds
        gracefully (e.g. fall back to displaying `name`).
      example: us:metro

    SubmissionStatus:
      type: string
      enum: [pending, approved, rejected]
      description: Lifecycle state of a public submission.

    Region:
      type: object
      description: |
        A geographic unit an organization can serve. Regions form a
        directed acyclic graph; `parent_slugs` lists the direct parents
        (not transitive). Empty for top-of-hierarchy regions (states,
        multi-state regions, transit federations).
      required: [id, kind, name, slug, country, scope_tier, parent_slugs]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/RegionKind' }
        name: { type: string, example: Brooklyn }
        slug:
          type: string
          example: brooklyn
          description: Globally unique across countries.
        country: { $ref: '#/components/schemas/Country' }
        scope_tier: { $ref: '#/components/schemas/ScopeTier' }
        parent_slugs:
          type: array
          items: { type: string }
          description: |
            Direct parents in the region graph. Clients can walk these
            to render breadcrumbs without a second request.

    Org:
      type: object
      description: |
        A single advocacy organization. `regions` is denormalized onto
        the organization for ergonomic JSON output — it lists every
        region the org serves, not just the regions that matched the
        current query.
      required: [id, slug, name, short_desc, website_url, tags, regions, added_at]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          example: transalt
        name:
          type: string
          example: Transportation Alternatives
        short_desc:
          type: string
          example: NYC-wide advocacy for walking, biking, and public transit.
        website_url:
          type: string
          format: uri
          example: https://www.transalt.org
        contact_url:
          type: string
          format: uri
          description: Optional. URL of the org's contact page.
        tags:
          type: array
          items:
            type: string
          description: |
            Open-ended labels. The canonical set is documented in
            `CLAUDE.md` (transit, safe-streets, cycling, walking,
            vision-zero, policy, grassroots, political, neighborhood);
            new labels may be introduced via seed data.
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
          description: |
            Every region this org serves, denormalized. Unordered —
            address regions by `slug`, not by position. Any apparent
            ordering is a process-internal handle (the loader sorts by
            a synthetic, load-order-assigned ID that is not stable
            across deploys), not a stable identifier; do not depend on
            it.
        added_at:
          type: string
          format: date
          example: "2026-05-21"
          description: |
            Date the org was added to the atlas. Date-only (no time
            component). Sourced from the seed file's `added_at` field
            on import, and from the approval date for orgs added via
            the submission queue. Drives the homepage "Recently
            indexed" strip's newest-first ordering.

    LookupOrg:
      description: |
        An `Org` augmented with the per-lookup `matched_region_slugs`
        field. Returned only by `/api/v1/lookup`; other endpoints that
        return organizations use the base `Org` schema.
      allOf:
        - $ref: '#/components/schemas/Org'
        - type: object
          required: [matched_region_slugs]
          properties:
            matched_region_slugs:
              type: array
              minItems: 1
              items: { type: string }
              description: |
                Slugs of the regions whose membership caused this org
                to surface for the current lookup. A non-empty subset
                of the org's `regions[*].slug`. Useful for
                explainability and debugging.

    LookupQuery:
      type: object
      required: [postal_code, country]
      properties:
        postal_code:
          type: string
          example: "11217"
        country:
          $ref: '#/components/schemas/Country'

    LookupResult:
      type: object
      description: |
        Response shape of `GET /api/v1/lookup`. `local`, `regional`,
        and `statewide` are always present (possibly empty arrays).
        Orgs are bucketed by the scope_tier and kind of the attachment
        region they matched on: `local` for city/county-tier
        attachments; `statewide` for state/province-tier attachments
        (`us:state`, `ca:province`); `regional` for everything in
        between (metro/CMA/regional-district/transit-federation and
        multi-state coalitions). `national`-tier attachments are always
        filtered.
        `resolved_ancestry` is the postal code's leaf region followed
        by all ancestors, ordered most-specific first — clients can use
        it to render breadcrumbs without walking the graph themselves.
      required: [query, resolved_place_label, resolved_ancestry, local, regional, statewide]
      properties:
        query:
          $ref: '#/components/schemas/LookupQuery'
        resolved_place_label:
          type: string
          example: "Brooklyn, NYC — New York Metro"
        resolved_ancestry:
          type: array
          items: { $ref: '#/components/schemas/Region' }
        local:
          type: array
          description: |
            Orgs with at least one matched attachment region of
            `scope_tier='local'` (cities, counties, boroughs).
          items: { $ref: '#/components/schemas/LookupOrg' }
        regional:
          type: array
          description: |
            Orgs whose matched attachment regions are sub-state
            `scope_tier='regional'` (metros, CMAs, regional districts,
            transit federations, multi-state coalitions) with no
            local or state/province match.
          items: { $ref: '#/components/schemas/LookupOrg' }
        statewide:
          type: array
          description: |
            Orgs whose matched attachment regions include a
            state/province-tier region (`us:state`, `ca:province`)
            and no `local` match. Surfaced as a distinct "State /
            Provincial" section so statewide coalitions don't blur
            into metro-level groups.
          items: { $ref: '#/components/schemas/LookupOrg' }

    RegionSummary:
      type: object
      description: |
        A region (any non-national kind) plus its approved-org counts.
        Used by `GET /api/v1/regions` to populate the Browse index.

        Two counts are exposed:

        * `org_count` — distinct approved orgs attached to this region
          OR any descendant in the DAG. Best for per-row "how much
          coverage does this region have" displays (a metro's count
          shows orgs from the metro + every city/borough/county
          under it).
        * `direct_org_count` — distinct approved orgs attached
          DIRECTLY to this region (no descendant walk). Use this when
          summing across rows in a country/page total: summing
          `org_count` double-counts orgs that surface under both a
          metro and one of its child cities.
      required: [region, org_count, direct_org_count]
      properties:
        region:
          $ref: '#/components/schemas/Region'
        org_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Distinct approved orgs attached to this region OR any
            descendant in the region DAG.
        direct_org_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Distinct approved orgs attached DIRECTLY to this region
            (no descendant walk). Sums across rows yield a deduped
            total.
        browse_parent_slug:
          type: string
          nullable: true
          description: |
            For cities, the slug of the nearest ancestor in the
            default browse set (a metro / CMA / regional-district).
            Lets clients group cities visually under their parent
            metro without a second request. Null for metros and for
            standalone cities whose walk doesn't reach a browseable
            ancestor.
          example: chicago-metro

    RegionDetail:
      type: object
      description: |
        A region (any non-national kind) with the organizations
        in scope for it, bucketed by attachment tier. "In scope"
        means orgs attached to the region itself or any DAG
        descendant — a metro surfaces its constituent cities'
        orgs, a state surfaces every metro/city beneath it.
        Ancestor orgs are NOT pulled in: this is "what does the
        region contain?", not "what works at this address?" (the
        latter is `/lookup`'s job, with its upward ancestor walk).

        Keeping the in-scope set descendant-only means the
        `RegionSummary.org_count` shown on the browse card matches
        the count delivered by this endpoint — no surprises when a
        user clicks through.

        Orgs are bucketed by the `scope_tier` and kind of the
        attachment region they matched on — `local` for city/county-tier
        attachments, `statewide` for state/province-tier attachments
        (`us:state`, `ca:province`), `regional` for the sub-state middle
        (metro/CMA/regional-district/transit-federation/multi-state).
        `national`-tier attachments are always filtered.

        Each `LookupOrg.matched_region_slugs` names the
        attachment regions in scope that caused the org to
        surface — useful for "matched via X" affordances in
        clients.

        The `ancestry` array is the upward walk from this region
        to the root (closest-first, excluding self and any
        `scope_tier='national'` rows). Clients use it to render
        breadcrumbs.

        `descendant_region_names` is a slug → display-name map for
        every descendant region (city, borough, county, …) that an
        org in `local` or `regional` references via
        `matched_region_slugs`. Lets clients render
        "Matched via Brooklyn" instead of the raw slug
        "matched via brooklyn-ny" without a second request. The
        focus region's own slug and ancestry slugs are NOT included
        (clients seed those from `region` + `ancestry`). Empty
        object (`{}`) when no descendants need resolving.
      required: [region, local, regional, statewide, ancestry, descendant_region_names]
      properties:
        region:
          $ref: '#/components/schemas/Region'
        local:
          type: array
          description: |
            Orgs in scope with at least one matched attachment
            region of `scope_tier='local'` (cities, counties,
            boroughs).
          items:
            $ref: '#/components/schemas/LookupOrg'
        regional:
          type: array
          description: |
            Orgs in scope whose matched attachment regions are
            sub-state `scope_tier='regional'` (metros, CMAs, regional
            districts, transit federations, multi-state coalitions),
            with no local or state/province match.
          items:
            $ref: '#/components/schemas/LookupOrg'
        statewide:
          type: array
          description: |
            Orgs in scope whose matched attachment regions include a
            state/province-tier region (`us:state`, `ca:province`)
            and no `local` match.
          items:
            $ref: '#/components/schemas/LookupOrg'
        ancestry:
          type: array
          description: |
            Ancestors of `region`, ordered closest-first (the
            region's direct parent at index 0, then the
            grandparent, … up to the root). Excludes the region
            itself and any `scope_tier='national'` rows.
          items:
            $ref: '#/components/schemas/Region'
        descendant_region_names:
          type: object
          additionalProperties:
            type: string
          description: |
            Slug → display-name lookup for descendant regions
            referenced by `matched_region_slugs` in `local`,
            `regional`, or `statewide`. Excludes the focus region and its
            ancestors (clients seed those from `region` and
            `ancestry`). Empty object when no descendants need
            resolving.
          example:
            brooklyn-ny: Brooklyn
            kings-county-ny: Kings County, NY

    RegionSummariesEnvelope:
      type: object
      description: |
        Collection envelope for `GET /api/v1/regions`. Wraps the
        region list in a `meta` + `data` shape so every list
        response carries the ODbL attribution alongside its
        payload, even when transport-level headers are stripped.
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/RegionSummary'

    RegionSearchResult:
      type: object
      description: |
        A region matched by `GET /api/v1/regions/search`, plus a
        disambiguation hint for type-ahead display.
      required: [region, context_label]
      properties:
        region:
          $ref: '#/components/schemas/Region'
        context_label:
          type: string
          description: |
            The nearest state/province-equivalent ancestor's name (e.g.
            "New York" for the `queens` borough), to disambiguate
            same-named regions in a type-ahead. Empty string when the
            region has no resolvable state ancestor (a state itself, or
            a top-level region).
          example: New York

    RegionSearchResultsEnvelope:
      type: object
      description: |
        Collection envelope for `GET /api/v1/regions/search`. Same shape
        contract as `RegionSummariesEnvelope`.
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/RegionSearchResult'

    RecentEnvelope:
      type: object
      description: |
        Collection envelope for `GET /api/v1/recent`. Same shape
        contract as `RegionSummariesEnvelope`.
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Org'

    SubmissionPayload:
      type: object
      description: |
        The proposed organization, as submitted by a member of the
        public. There is no `tags` field: the public form doesn't
        collect tags — an editor assigns them while reviewing the
        promotion PR, so they aren't part of the submission wire shape.
      required: [name, short_desc, website_url]
      properties:
        name:
          type: string
        short_desc:
          type: string
        website_url:
          type: string
          format: uri
        contact_url:
          type: string
          format: uri
          description: Optional.
        region_slugs:
          type: array
          items:
            type: string
          description: |
            Optional. Slugs of the regions this organization serves
            (e.g. `["brooklyn-ny","nyc-metro"]`). When provided, every
            entry must resolve against the `regions` table at submit
            time. May be omitted or sent as `[]` when the submitter
            doesn't know the canonical slug — editors finalize the
            region in PR review using `submitter_note`.

    NewSubmissionRequest:
      type: object
      description: Request body for `POST /api/v1/submissions`.
      required: [payload]
      properties:
        payload:
          $ref: '#/components/schemas/SubmissionPayload'
        submitter_name:
          type: string
          description: Optional. The submitter's name.
        submitter_email:
          type: string
          format: email
          description: Optional. The submitter's contact email.
        submitter_note:
          type: string
          description: Optional. Free-form note to the moderators.

    Submission:
      type: object
      description: A queued or processed public submission.
      required: [id, payload, status, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            UUIDv7 string generated server-side when the submission was
            accepted. This is the only ID exposed on the wire.
        payload:
          $ref: '#/components/schemas/SubmissionPayload'
        submitter_name:
          type: string
        submitter_email:
          type: string
          format: email
        submitter_note:
          type: string
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        created_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          description: Set when status moves from `pending` to a terminal state.
        promotion_pr_url:
          type: string
          format: uri
          description: |
            Set on approval when the GitHub PR worker successfully opens a
            pull request appending the approved org to `api/seed/orgs.toml`.
            The PR is the editorial-review surface; the org becomes visible
            after a maintainer merges it and the API redeploys.
        promotion_error:
          type: string
          description: |
            Set on approval when the GitHub PR worker failed (network,
            auth, etc.). The submission stays `approved`; the PR is
            re-queued via `urbanist-atlas-server submissions retry-pr`.
        rejection_reason:
          type: string
          description: Set on rejection.

    RejectSubmissionRequest:
      type: object
      description: Request body for `POST /api/v1/admin/submissions/{id}/reject`.
      required: [reason]
      properties:
        reason:
          type: string
          description: Free-form note shown to the submitter if email notifications are enabled, and persisted for audit.

    ProblemDetails:
      type: object
      description: |
        Standard [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457.html)
        Problem Details object. Returned on every non-2xx response with
        content-type `application/problem+json`.

        The `type` field is a stable URI identifying the problem class.
        The current v1 type values are:

        - `https://urbanistatlas.com/problems/validation` — request was
          malformed or missing a required field (HTTP 400).
        - `https://urbanistatlas.com/problems/not-found` — the
          requested resource does not exist (HTTP 404).
        - `https://urbanistatlas.com/problems/military-postal-code` — the
          looked-up code is a US military (APO/FPO) or diplomatic (DPO)
          ZIP, which has no residential region; enter a residential ZIP
          instead (HTTP 404).
        - `https://urbanistatlas.com/problems/unauthorized` — missing
          or invalid bearer token on a protected endpoint (HTTP 401).
        - `https://urbanistatlas.com/problems/conflict` — the requested
          state transition is not valid given current state (e.g.
          approving a non-pending submission) (HTTP 409).
        - `https://urbanistatlas.com/problems/rate-limited` — too many
          requests from this source (HTTP 429). A `Retry-After` header
          is also returned.
        - `https://urbanistatlas.com/problems/internal` — an
          unexpected server error (HTTP 500).

        These URIs are stable identifiers; they do not necessarily
        dereference to a human-readable page yet.

        Additional fields beyond the RFC's standard five are permitted
        and consumers should ignore unknown fields. The `request_id`
        extension is included on every error response and matches the
        `X-Request-ID` response header so clients can quote it when
        reporting bugs.
      example:
        type: "https://urbanistatlas.com/problems/not-found"
        title: "Postal code not found"
        status: 404
        detail: "No region is mapped to postal code 00000 (US)."
        instance: "/api/v1/lookup"
        request_id: "a1b2c3d4e5f6g7h8"
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
          example: "https://urbanistatlas.com/problems/validation"
          description: |
            URI reference that identifies the problem type. When
            absent or `about:blank`, the `title` alone identifies the
            problem.
        title:
          type: string
          example: "Bad Request"
          description: |
            Short, human-readable summary of the problem type. Should
            not change between occurrences of the same problem type,
            except for localization.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 400
          description: |
            HTTP status code generated by the origin server. Mirrors
            the response's status line; included in the body so it
            survives proxies that mangle status codes.
        detail:
          type: string
          example: "postal_code is required"
          description: |
            Human-readable explanation specific to this occurrence.
            Safe to display to end users.
        instance:
          type: string
          format: uri-reference
          example: "/api/v1/lookup"
          description: |
            URI reference that identifies the specific occurrence of
            the problem — typically the request path.
        request_id:
          type: string
          example: "a1b2c3d4e5f6g7h8"
          description: |
            Extension field. The server-side request ID; matches the
            `X-Request-ID` response header. Useful for users to quote
            when reporting bugs.
        errors:
          type: object
          additionalProperties:
            type: string
          description: |
            Extension field. Per-field validation messages keyed by
            JSON field name (e.g. `name`, `short_desc`,
            `submitter_email`). Present only on validation failures
            where multiple fields may be at fault — currently
            `POST /api/v1/submissions`. Each value is a sentence safe
            to render to end users; clients can dispatch them into
            per-field form validators.
          example:
            short_desc: "A short description is required."
            website_url: "Website URL must use http or https."
