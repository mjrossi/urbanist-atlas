# sqlc configuration for the Urbanist Atlas Postgres store.
#
# Run from the api/ directory:   sqlc generate -f internal/store/postgres/sqlc.yaml
# (or use `just api-sqlc-gen`).
#
# The generated `gen` package is committed to git and regenerated only
# when schema or queries change. The Postgres store (../store.go)
# imports `gen` and adapts its signatures to the pkg/atlas.Store
# interface; pkg/atlas itself stays driver-agnostic.

version: "2"

sql:
  - engine: "postgresql"
    schema: "../../../migrations"
    queries: "queries"
    gen:
      go:
        package: "gen"
        out: "gen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: false
        emit_interface: false
        emit_methods_with_db_argument: false
