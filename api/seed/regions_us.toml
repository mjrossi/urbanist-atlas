# Region taxonomy for the United States (leaves + intermediate
# regions). The state tier lives in regions_us_states.toml and loads
# first; entries here reference state slugs as parents via cross-file
# resolution.
#
# Each [[region]] entry creates one row in `regions`; the `parents`
# array creates rows in `region_parents`. A region may appear before
# its parents in the file — loadregions resolves slugs after parsing.
# Parents not defined in this file are resolved from the DB at write
# time (see internal/loadregions/write.go's RegionIDBySlug fallback).
#
# See docs/region-graph.md for modeling conventions, including:
#   - State edges live on the leaf (city), not on the metro.
#   - Multi-state/federation regions parent the metro or the leaf,
#     not the state.
#   - Transit federations are siblings of states, parented under the
#     leaves they serve.
#
# Recommended sort_priority ranges (see docs/region-graph.md §9):
#   10  borough / neighborhood
#   15  consolidated city
#   20  county
#   40  metro
#   50  transit federation / RTA-style region
#   60  state / province  (defined in regions_us_states.toml)
#   80  multi-state / multi-province

# Multi-state and transit-federation regions live in
# regions_us_multistate.toml (loaded between us_states and us_msas so
# MSA overrides can parent under them). City/borough/county leaves
# below cross-reference them via the loader's DB-lookup fallback.

# --- Metros ---
#
# All US MSAs (Census CBSAs) live in regions_us_msas.toml, generated
# by `urbanist-atlas-server etl regenerate --country=US`. Editorial
# overrides for slug/name/parents are in regions_us_msa_overrides.toml.
# Load order ensures the MSA file is upserted before this file so the
# city leaves below can cross-reference MSA slugs as parents.

# --- Counties (where they matter for advocacy reach) ---

[[region]]
slug = "cook-county"
kind = "us:county"
name = "Cook County"
scope_tier = "local"
sort_priority = 20
parents = ["chicago-metro", "rta-service-area"]

[[region]]
slug = "lake-county-in"
kind = "us:county"
name = "Lake County, IN"
scope_tier = "local"
sort_priority = 20
parents = ["chicago-metro", "in"]

# --- NYC: borough split (slice #7.5.2) ---
#
# `nyc` is the only US city we model sub-municipally at v1 — its
# boroughs are also counties (the Census ZCTA-to-county crosswalk
# naturally distinguishes them) and each has a distinct civic
# identity + advocacy ecosystem. See docs/region-graph.md §8.
#
# After the split:
#   - `nyc` is a regional intermediate region (between borough leaves
#     and `nyc-metro`); its only parent is `nyc-metro`. Citywide NYC
#     orgs attach here (TransitCenter, Transportation Alternatives,
#     Riders Alliance).
#   - Boroughs are local leaves; they carry the state edge (`ny`)
#     directly per rule §1.

[[region]]
slug = "nyc"
kind = "us:city"
name = "New York City"
scope_tier = "regional"
sort_priority = 15
parents = ["nyc-metro"]

[[region]]
slug = "brooklyn"
kind = "us:borough"
name = "Brooklyn"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

[[region]]
slug = "manhattan"
kind = "us:borough"
name = "Manhattan"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

[[region]]
slug = "queens"
kind = "us:borough"
name = "Queens"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

[[region]]
slug = "bronx"
kind = "us:borough"
name = "The Bronx"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

[[region]]
slug = "staten-island"
kind = "us:borough"
name = "Staten Island"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

