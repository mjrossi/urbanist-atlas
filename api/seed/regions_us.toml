# --- Counties (where they matter for advocacy reach) ---

[[region]]
slug = "cook-county"
kind = "us:county"
name = "Cook County"
scope_tier = "local"
sort_priority = 20
parents = ["chicago-metro", "rta-service-area"]

[[region]]
slug = "lake-county-in"
kind = "us:county"
name = "Lake County, IN"
scope_tier = "local"
sort_priority = 20
parents = ["chicago-metro", "in"]

# --- NYC: borough split (slice #7.5.2) ---
#
# `nyc` is the only US city we model sub-municipally at v1 — its
# boroughs are also counties (the Census ZCTA-to-county crosswalk
# naturally distinguishes them) and each has a distinct civic
# identity + advocacy ecosystem. See docs/region-graph.md §8.
#
# After the split:
#   - `nyc` is a regional intermediate region (between borough leaves
#     and `nyc-metro`); its only parent is `nyc-metro`. Citywide NYC
#     orgs attach here (TransitCenter, Transportation Alternatives,
#     Riders Alliance).
#   - Boroughs are local leaves; they carry the state edge (`ny`)
#     directly per rule §1.

[[region]]
slug = "nyc"
kind = "us:city"
name = "New York City"
scope_tier = "regional"
sort_priority = 15
parents = ["nyc-metro"]

[[region]]
slug = "brooklyn"
kind = "us:borough"
name = "Brooklyn"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

[[region]]
slug = "manhattan"
kind = "us:borough"
name = "Manhattan"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

[[region]]
slug = "queens"
kind = "us:borough"
name = "Queens"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

[[region]]
slug = "bronx"
kind = "us:borough"
name = "The Bronx"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

[[region]]
slug = "staten-island"
kind = "us:borough"
name = "Staten Island"
scope_tier = "local"
sort_priority = 10
parents = ["nyc", "ny"]

