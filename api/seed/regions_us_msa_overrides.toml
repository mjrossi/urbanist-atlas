# US MSA editorial overrides applied by etl regenerate --country=US.
#
# Each [[override]] block pins the slug, display name, and parent
# edges for a specific Census CBSA code. The ETL replaces the
# auto-generated "<first-city>-<state>-metro" defaults with these
# values when writing regions_us_msas.toml.
#
# Use overrides for:
#   - well-known metros whose curated slug should be short (e.g.,
#     "nyc-metro" rather than "new-york-ny-metro")
#   - multi-state metros that should parent under an intermediate
#     multi-state advocacy region (nyc-tristate, chicagoland) rather
#     than the bare stateless umbrella the auto-gen path emits
#   - any future editorial cleanup of auto-generated names
#
# An override does NOT suppress portion generation: a multi-state CBSA
# still gets one us:metro-portion per spanned state (parents = [state,
# umbrella]) and the umbrella carries rollup_states = [each spanned
# state], exactly like an auto-generated multi-state metro. Set the full
# spanned set in rollup_states here (e.g. nyc-metro → ["nj", "ny"]); the
# ETL takes the override verbatim, so a partial list silently under-rolls.
#
# CBSA codes are stable identifiers across Census revisions; using
# them as the override key is more robust than keying by current slug.

[[override]]
cbsa_code = "35620"
slug = "nyc-metro"
name = "New York Metro"
parents = ["nyc-tristate"]
rollup_states = ["nj", "ny"]

[[override]]
cbsa_code = "16980"
slug = "chicago-metro"
name = "Chicago Metro"
parents = ["chicagoland"]
rollup_states = ["il", "in"]

# Boston-Cambridge-Newton (CBSA 14460) spans MA + NH. Unlike NYC and
# Chicago it has no advocacy-coalition node, so it is a plain STATELESS
# umbrella (parents = []) with the full rollup_states and ETL-generated
# greater-boston-ma / greater-boston-nh portions — exactly the auto-gen
# multi-state shape. This override exists only to pin the curated short
# slug/name ("greater-boston" rather than "boston-ma-metro"). Its former
# parents = ["ma"] leaked Boston's NH ZIPs (03xxx) up into Massachusetts;
# the stateless umbrella + portions fixes that (GitHub #79).
[[override]]
cbsa_code = "14460"
slug = "greater-boston"
name = "Greater Boston"
parents = []
rollup_states = ["ma", "nh"]

# Single-state metros parent to their state, matching the
# auto-generated MSA convention for every other US metro. The
# curated leaves below also carry a direct state edge
# (region-graph.md §1); AncestorRegions' DISTINCT ON (id) dedup
# handles the diamond, so resolved_ancestry shows the state
# exactly once at its shallowest depth. Without these edges,
# /regions/<metro-slug> wouldn't surface state-level orgs in its
# Regional bucket — the slice that unified Region detail with
# Lookup scope exposed the gap.

[[override]]
cbsa_code = "41860"
slug = "sf-bay-area"
name = "San Francisco Bay Area"
parents = ["ca-state"]

[[override]]
cbsa_code = "33100"
slug = "greater-miami"
name = "Greater Miami"
parents = ["fl"]

[[override]]
cbsa_code = "42660"
slug = "seattle-metro"
name = "Seattle Metro"
parents = ["wa"]

[[override]]
cbsa_code = "31080"
slug = "greater-la"
name = "Greater Los Angeles"
parents = ["ca-state"]

# Bridgeport-Stamford-Danbury, CT (all of Fairfield County) is part of
# the NY commuter shed, so its metro parents under the nyc-tristate
# multi-state region in addition to its state. Without the nyc-tristate
# edge, Fairfield ZIPs (Stamford 06902, Greenwich, Norwalk, Darien, …)
# never surface Tri-State orgs through the ancestor walk even though
# they are squarely in the Tri-State region. The `ct` edge is retained
# so Connecticut state-tier orgs still surface for these ZIPs. The
# companion fix that re-anchors the residential CT ZIPs at their metro
# (they were falling through to the bare `ct` state anchor due to the
# 2020-ZCTA-vs-2023-CBSA county-vintage gap) is ReconcileCTLegacyCounties
# in internal/etl/us/crosswalk.go — see etl/SOURCES.md §"Known
# data-vintage gaps".
[[override]]
cbsa_code = "14860"
slug = "bridgeport-ct-metro"
name = "Bridgeport Metro"
parents = ["nyc-tristate", "ct"]
