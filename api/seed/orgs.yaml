# Hand-curated initial dataset for Urbanist Atlas.
#
# Schema: see internal/seed/orgs.go. Each org lists the postal codes
# it serves; the `seed` subcommand resolves those through the
# postal_codes table (populated by `loadpostal`) into region IDs.
#
# Inclusion criteria: transit and/or safe-streets advocacy in the US
# or Canada. Housing-only / YIMBY-only orgs are out of scope per
# CLAUDE.md. URLs are real and were last spot-checked on 2026-05-16.
#
# Bias: this is a starter set; expansion happens via the submission
# queue (slice #5) once that lands.

orgs:
