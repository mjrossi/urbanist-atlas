# Province/territory-tier regions for Canada.
#
# 10 provinces + 3 territories = 13 entries.
# All scope_tier='regional', sort_priority=60 per the bands in
# docs/region-graph.md §9. No parents — provinces sit at the top of
# the CA subgraph.
#
# Loaded at API boot by internal/seedfiles into the in-memory
# FileStore, BEFORE regions_ca.toml. Leaves in regions_ca.toml may
# reference these slugs as parents via cross-file resolution
# (internal/seedfiles/regions.go).
#
# Slug convention: lowercase 2-letter postal abbreviation, except:
#   - 'nl-province' for Newfoundland and Labrador (the bare 'nl'
#     collides with the country code for the Netherlands).
#
# Kinds:
#   - ca:province for the 10 provinces
#   - ca:territory for the 3 territories

# --- Provinces (10, alphabetical by slug) ---

