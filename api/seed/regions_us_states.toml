# State-tier regions for the United States.
#
# 50 states + the District of Columbia + Puerto Rico = 52 entries.
# All scope_tier='regional', sort_priority=60 per the bands in
# docs/region-graph.md §9 (state/province band). No parents — states
# sit at the top of the US subgraph.
#
# This file loads BEFORE regions_us.toml in just loaddata / loaddata
# orchestration. Leaves in regions_us.toml may reference these slugs
# as parents via cross-file resolution (internal/loadregions/write.go
# resolves cross-file parents via the batched RegionIDsBySlugs query
# after the in-file regions land).
#
# Slug convention: lowercase 2-letter postal code, except:
#   - 'ca-state' for California (the bare 'ca' collides with the
#     country code for Canada).
#   - 'de-state' for Delaware (collides with the country code for
#     Germany).
#   - 'la-state' for Louisiana (avoids confusion with the LA metro).
# DC and PR get descriptive slugs.
#
# Kinds:
#   - us:state for the 50 states
#   - us:federal-district for DC
#   - us:territory for PR

# --- States (50, alphabetical by slug) ---

[[region]]
slug = "ak"
kind = "us:state"
