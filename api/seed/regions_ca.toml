# Region taxonomy for Canada (leaves + intermediate regions). The
# province/territory tier lives in regions_ca_provinces.toml and loads
# first; entries here reference province slugs as parents via
# cross-file resolution. No county tier (CA uses regional districts
# instead); no country tier (per v1 scope).

# --- CMAs ---
#
# All Statistics Canada CMAs live in regions_ca_cmas.toml, generated
# by `urbanist-atlas-server etl regenerate --country=CA`. Slug + kind
# overrides for the well-known curated CMAs (toronto-cma,
# montreal-cma, metro-vancouver) live in api/internal/etl/ca/mappings.go.
# Load order ensures the CMA file is upserted before this file so the
# city leaves below can cross-reference CMA slugs as parents.

# --- Cities ---

[[region]]
slug = "vancouver"
kind = "ca:city"
name = "Vancouver"
scope_tier = "local"
sort_priority = 10
parents = ["metro-vancouver"]

[[region]]
slug = "burnaby"
kind = "ca:city"
name = "Burnaby"
scope_tier = "local"
sort_priority = 10
parents = ["metro-vancouver"]

[[region]]
slug = "richmond"
kind = "ca:city"
name = "Richmond"
scope_tier = "local"
sort_priority = 10
parents = ["metro-vancouver"]

[[region]]
slug = "toronto"
kind = "ca:city"
name = "Toronto"
scope_tier = "local"
sort_priority = 10
parents = ["toronto-cma"]

[[region]]
slug = "montreal"
kind = "ca:city"
name = "Montréal"
scope_tier = "local"
sort_priority = 10
parents = ["montreal-cma"]
