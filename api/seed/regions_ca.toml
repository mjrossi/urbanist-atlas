# Region taxonomy for Canada. No county tier (CA uses regional
# districts instead); no country tier (per v1 scope).

# --- Provinces ---

[[region]]
slug = "bc"
kind = "ca:province"
name = "British Columbia"
scope_tier = "regional"
sort_priority = 60
parents = []

[[region]]
slug = "on"
kind = "ca:province"
name = "Ontario"
