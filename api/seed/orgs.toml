# Hand-curated initial dataset for Urbanist Atlas.
# region_slugs resolves to region IDs in the regions table; an unknown
# slug is a hard error at seed time.
#
# Inclusion criteria: transit and/or safe-streets advocacy in the US
# or Canada. Housing-only / YIMBY-only orgs are out of scope per
# CLAUDE.md. URLs for orgs added or updated in a given slice are
# spot-checked at that slice's verification date (see commit
# messages).
#
# Slice #7.8 (2026-05-22) broadened the geographic canvas: added
# top-31–50 US metros, CA CMAs #6–10, big-state depth for the
# largest US states (CA/NY/TX to ≥3; FL/PA/MI to ≥2), and city-
# leaf orgs for prominent non-top-50 metros (Madison, Boise,
# Anchorage, Ann Arbor, Boulder, New Haven, Tucson, Albany, Spokane,
# Tallahassee, Charleston SC, Grand Rapids, Fresno, Albuquerque,
# Halifax, Mississauga). +73 net-new orgs, growing the dataset
# from 130 to 203. Albuquerque is covered by multi-anchoring the
# pre-existing BikeABQ entry at [albuquerque-nm-metro, nm] per the
# Street Trust precedent, rather than adding a new city-leaf row.
# Gaps documented inline at the relevant section headers
# (Jacksonville, Oklahoma City, Birmingham, Lexington, Reno,
# Worcester, Tulsa, Long Beach, Chattanooga, Knoxville, etc.).
#
# Slice #7.7 (2026-05-21) added 23 net-new orgs across the top-20
# US metros; older entries carry the verification dates documented
# in their original slice commits.
#
# See docs/superpowers/specs/2026-05-20-org-seed-growth-design.md
# for the original coverage-gate design (raised to ≥3 orgs per
# top-20 metro in slice 7.7), the Activity Bar + Scope Precedents
# (public-agency oversight bodies, multi-issue 501c3s with named
# transit programs, publication/advocacy hybrids, chapter-affiliate
# rules), and the Canvas Adjustments log of documented gaps. Slice
# 7.8 extends those gates without changing the activity bar or scope
# precedents.

# --- NYC region ---

[[org]]
slug = "transportation-alternatives"
name = "Transportation Alternatives"
short_desc = "New York City's largest streets and mobility advocacy organization. Pushes the city to reclaim its streets from automobile dependence with safer crossings, protected bike lanes, expanded bus service, and the political muscle behind Vision Zero. Founded 1973."
website_url = "https://transalt.org"
contact_url = "https://transalt.org/contact"
tags = ["advocacy", "safe-streets", "cycling", "walking", "vision-zero"]
region_slugs = ["nyc"]

[[org]]
slug = "riders-alliance"
