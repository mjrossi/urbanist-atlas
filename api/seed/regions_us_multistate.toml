# US multi-state and transit-federation regions.
#
# These sit between the state tier (regions_us_states.toml) and the
# MSA tier (regions_us_msas.toml) in the load order so MSA overrides
# (regions_us_msa_overrides.toml) can reference them as parents
# (e.g., nyc-metro → nyc-tristate, chicago-metro → chicagoland).
#
# Modeling conventions: see docs/region-graph.md §2 (federations
# parent metros/leaves, not states) and §3 (transit federations
# parented under the leaves/counties they serve, sibling to the
# state tier).

# --- Multi-state advocacy regions ---

[[region]]
slug = "nyc-tristate"
kind = "us:multi-state"
name = "Tri-State Region (NY/NJ/CT)"
scope_tier = "regional"
sort_priority = 80
parents = []

[[region]]
slug = "chicagoland"
kind = "us:multi-state"
name = "Chicagoland (IL/IN/WI)"
scope_tier = "regional"
sort_priority = 80
parents = []

# --- Transit federations ---

[[region]]
slug = "rta-service-area"
kind = "us:transit-federation"
name = "RTA Service Area (Cook + 5 collar)"
scope_tier = "regional"
sort_priority = 50
parents = ["il"]
