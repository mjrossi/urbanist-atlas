name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Activates mise.ci.toml's [env] overlay on top of mise.toml's
  # [tools] + [env]. Mirrors the pattern in mjrossi-portfolio-website.
  MISE_ENV: ci

jobs:
  # api/ and web/ each gate on their own scaffolding state so CI passes
  # cleanly on the initial bones commit (when neither half has real code
  # yet) and lights up automatically as each side is filled in.

  detect:
    name: detect scaffolded halves
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          # `find -print -quit` exits on the first match, so this is
          # fast even as the tree grows. compgen's "**" globbing
          # needs `shopt -s globstar`, which isn't on by default in
          # Actions' bash — find sidesteps the issue.
          if [ -n "$(find api -name '*.go' -type f -print -quit 2>/dev/null)" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    name: api (go)
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Cache the Go module download cache (~/go/pkg/mod) and the
      # compiled-object build cache (~/.cache/go-build). Keyed on
      # api/go.sum so the cache invalidates the moment any dep moves;
      # the restore-key fallback means a go.sum change still hydrates
      # most of the build cache from the previous run, avoiding a
      # cold rebuild. On a cache hit this saves ~30-60s on every
      # PR push (typical: ~100MB of modules + the cgo-free pgx/
      # testcontainers/chi compile tree).
      - name: Cache Go modules + build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@v4
      - name: Show mise version
        # Surfaces the installed mise version in the job log so a
        # future breaking change to `mise env --dotenv` (used below)
        # is obvious at a glance rather than buried in a sed-like
        # diff. jdx/mise-action doesn't pin a specific mise binary,
        # so this is the cheapest visibility we get.
        run: mise --version
      - name: Export mise [env] to GITHUB_ENV
        # jdx/mise-action installs mise but does NOT auto-propagate
        # [env] to subsequent steps. Re-export so URBANIST_* values
        # from mise.toml + mise.ci.toml are visible to the steps below.
        # `mise env --dotenv` emits raw KEY=VALUE pairs (no quoting,
        # no `export`), which is exactly the format $GITHUB_ENV
        # expects — avoids a fragile sed regex over `mise env`'s
        # bash output.
        run: mise env --dotenv >> "$GITHUB_ENV"
      # `just api-check` = vet + test + go-generate/sqlc drift check.
      # Single source of truth for "what CI runs"; same recipe a
      # contributor runs locally before pushing.
      - run: just api-check
      # Integration tests (build tag `integration`) spin a Postgres
      # container per-test via testcontainers-go and exercise the
      # loadregions → loadpostal → seed → /lookup pipeline end-to-end
      # against real SQL. Catches FK-resolution, recursive-CTE, and
      # seed-load regressions the unit suite can't see — e.g., the
      # diamond-dedup bug (commit 47db5b7) and the suffixed-slug bug
      # (commit 86a70a5) from slice #7.6 would both have failed this
      # step immediately. ubuntu-latest runners have Docker installed
      # and running, so testcontainers Just Works with no extra setup.
      - run: just api-test-integration

  web:
    name: web (vite)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Show mise version
        run: mise --version
      - name: Export mise [env] to GITHUB_ENV
        run: mise env --dotenv >> "$GITHUB_ENV"
      # `just web-check` = deps + lint + test + build + openapi-typescript
      # drift check. The drift check catches the case where
      # api/openapi.yaml changes but src/lib/api.gen.ts wasn't
      # regenerated — silently shipping stale wire types.
      - run: just web-check
