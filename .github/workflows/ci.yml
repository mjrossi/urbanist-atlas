name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger so a maintainer can re-deploy current `main` without
  # an empty commit (e.g. after fixing a Fly-side config out-of-band).
  # The `detect` → `api` → `web` → `deploy-api` chain runs the same way
  # a push to main would.
  workflow_dispatch:

# Least-privilege default for every job: all of them only read the repo
# (checkout, cache, build, test, seed-validate). None writes to the repo,
# comments on PRs, or pushes packages, so contents: read suffices — and
# it pins the scope even if the org/repo default is read-write. Jobs may
# restate it locally (deploy-api does); the Fly deploy authenticates with
# the scoped FLY_API_TOKEN secret, not GITHUB_TOKEN. Resolves CodeQL
# actions/missing-workflow-permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Activates mise.ci.toml's [env] overlay on top of mise.toml's
  # [tools] + [env]. Mirrors the pattern in mjrossi-portfolio-website.
  MISE_ENV: ci

jobs:
  # Per-half changed-path detection so each heavy job runs only when a PR
  # touches files relevant to it (an API-only PR skips the web job, and
  # vice-versa). Consulted on pull_request events only; on push to main /
  # workflow_dispatch the path gate is bypassed so the full suite runs.

  detect:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
      web: ${{ steps.paths.outputs.web }}
      data: ${{ steps.paths.outputs.data }}
    steps:
      - uses: actions/checkout@v6
      # The `global` anchor is folded into every filter: a change to the
      # workflow itself, the justfile, a mise config, or the Dockerfile
      # flips all three true, so a build/tooling change can never silently
      # under-run CI. dorny/paths-filter uses the GitHub API for the
      # PR-base diff, so the shallow checkout above is sufficient — no
      # fetch-depth tweak needed. (The action is on the repo's Actions
      # allowlist.)
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            global: &global
              - '.github/workflows/ci.yml'
              - 'justfile'
              - 'mise*.toml'
              - 'Dockerfile'
            api:
              - *global
              - 'api/**'
            web:
              - *global
              - 'web/**'
              - 'api/openapi.yaml'
            # Narrow to just the ETL/region surface: a Go-only PR that
            # doesn't touch the pipeline or the committed region overrides /
            # outputs skips the network-gated seed-determinism job entirely.
            data:
              - *global
              - 'etl/**'
              - 'api/internal/etl/**'
              - 'api/cmd/server/etl.go'
              - 'api/seed/regions_us_msa_overrides.toml'
              - 'api/seed/regions_ca_cma_overrides.toml'
              - 'api/seed/regions_us_msas.toml'
              - 'api/seed/regions_ca_cmas.toml'

  api:
    name: api (go)
    needs: detect
    # Run on non-PR events (push to main / dispatch always run the full
    # suite) OR when the PR touched api/**.
    if: github.event_name != 'pull_request' || needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Cache the Go module download cache (~/go/pkg/mod) and the
      # compiled-object build cache (~/.cache/go-build). Keyed on
      # api/go.sum so the cache invalidates the moment any dep moves;
      # the restore-key fallback means a go.sum change still hydrates
      # most of the build cache from the previous run, avoiding a
      # cold rebuild. On a cache hit this saves ~30-60s on every
      # PR push.
      - name: Cache Go modules + build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@v4
      - name: Show mise version
        # Surfaces the installed mise version in the job log so a
        # future breaking change to `mise env --dotenv` (used below)
        # is obvious at a glance rather than buried in a sed-like
        # diff. jdx/mise-action doesn't pin a specific mise binary,
        # so this is the cheapest visibility we get.
        run: mise --version
      - name: Export mise [env] to GITHUB_ENV
        # jdx/mise-action installs mise but does NOT auto-propagate
        # [env] to subsequent steps. Re-export so URBANIST_* values
        # from mise.toml + mise.ci.toml are visible to the steps below.
        # `mise env --dotenv` emits raw KEY=VALUE pairs (no quoting,
        # no `export`), which is exactly the format $GITHUB_ENV
        # expects — avoids a fragile sed regex over `mise env`'s
        # bash output.
        run: mise env --dotenv >> "$GITHUB_ENV"
      # `just api-check` = golangci-lint (vet + staticcheck + format
      # drift) + test + go-generate drift check.
      # Single source of truth for "what CI runs"; same recipe a
      # contributor runs locally before pushing. With the file-backed
      # FileStore as the runtime store, the previous Postgres-only
      # integration tests are gone; the FileStore is exercised against
      # the real bundled seed inside `just api-test`.
      - run: just api-check

  web:
    name: web (vite)
    needs: detect
    # Non-PR OR the PR touched web/** or the OpenAPI spec — a spec change
    # must re-run web-gen-check to catch api.gen.ts drift even when no
    # web/ file moved.
    if: github.event_name != 'pull_request' || needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Show mise version
        run: mise --version
      - name: Export mise [env] to GITHUB_ENV
        run: mise env --dotenv >> "$GITHUB_ENV"
      # `just web-check` = deps + lint + test + build + openapi-typescript
      # drift check. The drift check catches the case where
      # api/openapi.yaml changes but src/lib/api.gen.ts wasn't
      # regenerated — silently shipping stale wire types.
      - run: just web-check

  data:
    name: seed determinism
    needs: detect
    # Path gate (PRs only): the ETL pipeline + the committed region
    # overrides/outputs/fixtures (see the `data` filter in detect). The
    # regen reads the vendored etl/fixtures/ — no network.
    if: github.event_name != 'pull_request' || needs.detect.outputs.data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Go modules + build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@v4
      - name: Export mise [env] to GITHUB_ENV
        run: mise env --dotenv >> "$GITHUB_ENV"
      # `just seed-check` regenerates the region files and fails on drift
      # (mirrors api-gen-check). It runs FULLY OFFLINE: the regions sources
      # are vendored under etl/fixtures/ (the Census CBSA list as CSV + a
      # DBF-only CMA zip), so there is no network download and no xlsx→csv
      # step. This replaced a download-based gate that was chronically flaky
      # because StatsCan is unreachable from GitHub Actions runners.
      - run: just seed-check

  seed-validate:
    name: seed validate (pre-deploy gate)
    needs: detect
    # Path gate (PRs only): the api filter — api/seed/** ⊂ api/**.
    if: github.event_name != 'pull_request' || needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Go modules + build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: jdx/mise-action@v4
      - name: Export mise [env] to GITHUB_ENV
        run: mise env --dotenv >> "$GITHUB_ENV"
      # HOST-01b pre-deploy gate: load the EMBEDDED seed bundle via the
      # same BuildMemStore loader the server boots from and fail closed
      # (non-zero exit) on any malformed seed BEFORE the Fly deploy. This
      # is a distinct gate from the `api` unit tests and from the
      # network-gated `data` (seed-check) job: it is offline, mutates
      # nothing, and validates the hand-curated orgs.toml + leaves that
      # seed-check never loads. deploy-api needs it (below).
      - run: cd api && go run ./cmd/server seed validate

  deploy-api:
    name: deploy api → Fly
    # Deliberately NOT gated on `data` (seed-determinism). The deploy ships
    # the COMMITTED api/seed/ bundle baked into the image; seed-check only
    # proves a regen of *external* sources still matches — a reviewer drift
    # signal, not a deploy-safety property. The real fail-closed deploy gate
    # is `seed-validate` (offline, loads the embedded bundle the server
    # boots from), which stays here. Keeping the network-gated `data` job in
    # this list would let a transient census.gov/statcan.gc.ca blip block a
    # prod deploy of already-merged seeds.
    needs: [api, web, seed-validate]
    # Only deploy on merges to main (and on the workflow_dispatch
    # re-deploy escape hatch, also restricted to main). PR runs
    # validate but never deploy. The ref check on the dispatch arm
    # prevents a maintainer from accidentally shipping a feature
    # branch to prod via `gh workflow run ci.yml --ref my-branch`.
    if: |
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Override the workflow-level concurrency: never cancel an
    # in-flight deploy. Two rapid merges queue rather than fight.
    concurrency:
      group: deploy-api-fly
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          # Repo secret FLY_API_TOKEN_DEPLOY is a deploy-scoped Fly
          # token (`flyctl tokens create deploy -a urbanist-atlas`).
          # flyctl reads the env var FLY_API_TOKEN, hence the rename
          # at injection time.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEPLOY }}
        # --remote-only builds on Fly's builders, so the runner doesn't
        # need a working Docker. The image bundles api/seed/ and the
        # FileStore loads it at boot — no release_command, no DB.
        run: flyctl deploy -a urbanist-atlas --remote-only
      - name: Smoke-test /healthz
        # /healthz is exempt from the X-Atlas-Client shared-secret
        # middleware, so it works without provisioning a CI client
        # secret. Retry because Fly traffic cutover (old machine drain
        # + new machine warm) can briefly 502 even after `flyctl deploy`
        # returns. Five 5s attempts ≈ 25s of grace, well under the job
        # timeout and well over typical cutover latency.
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://api.urbanistatlas.com/healthz; then
              echo
              echo "healthz OK on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "healthz did not respond OK after 5 attempts" >&2
          exit 1
